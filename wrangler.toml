name = "omni-key-gate"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Свой адрес шлюза: Cloudflare сам создаст DNS-запись и сертификат (домен в этом же аккаунте).
routes = [
  { pattern = "gate.omnikeykiix.com", custom_domain = true }
]

# Автопилот канала: проверка раз в час (бесплатно). Посты уходят в 07:00 и 11:00 UTC.
[triggers]
crons = ["0 * * * *"]

# KV хранит, кому уже выдана ссылка (создано Cloudflare автоматически при первом деплое).
[[kv_namespaces]]
binding = "GATE_KV"
id = "b26f3e58a40a4b99b1e5f9b0a67b6644"
